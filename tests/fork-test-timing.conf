# Fork-measured CI timing and lane packing for bin/fm-test-run.sh.
# This fork runs more tests than upstream, so its CI needs its own measured
# duration hints and its own lane layout. They live here, read as an overlay,
# instead of inside the runner's tables, so an upstream catch-up never has to
# merge two copies of the same measurements.
# The row grammar and the overlay rules are owned by the header of
# bin/fm-fork-test-registry-lib.sh; docs/fm-test-portable-shards.md owns the
# measurement provenance and the refresh procedure.

# How many separate-runner shards the portable serial remainder splits into.
# The CI serial matrix carries the same count.
serial-shards 18

